
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Progress Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Student Progress Tracker</h1>
    <p>Track student learning progress easily.</p>

    <h2>Add Student Progress</h2>

    <form id="progressForm">
        <label for="studentName">Student Name:</label>
        <input type="text" id="studentName" required>

        <label for="courseName">Course Name:</label>
        <input type="text" id="courseName" required>

        <label for="completionPercentage">Completion Percentage:</label>
        <input
            type="number"
            id="completionPercentage"
            min="0"
            max="100"
            required
        >

        <button type="submit">Add Progress</button>
    </form>

    <h2>Student Progress Records</h2>

    <div id="progressList">
       
    </div>

    <script src="script.js"></script>
</body>
</html>
